<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;
        }
        #caption-box {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 80%;
            display: none;
            flex-direction: column;
            gap: 5px;
        }
        #italian-text {
            color: white;
            font-size: 34px;
            font-weight: bold;
        }
        #english-text {
            color: #cccccc;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div id="caption-box">
    <div id="italian-text">Inizializzazione...</div>
    <div id="english-text">Starting...</div>
</div>

<script>
    const italianText = document.getElementById('italian-text');
    const englishText = document.getElementById('english-text');
    const captionBox = document.getElementById('caption-box');
    
    let clearTimer = null;

    function updateUI(it, en) {
        italianText.innerText = it;
        englishText.innerText = en;
        captionBox.style.display = 'flex';
        
        if (clearTimer) clearTimeout(clearTimer);
        clearTimer = setTimeout(() => {
            captionBox.style.display = 'none';
        }, 5000);
    }

    async function translateText(text) {
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=it&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            const data = await response.json();
            return data[0].map(item => item[0]).join('');
        } catch (e) {
            console.error("Translation error:", e);
            return text;
        }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        updateUI("Errore del browser", "Speech Recognition not supported in this browser.");
    } else {
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        let lastFinalText = "";

        recognition.onresult = async (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            const currentText = finalTranscript + interimTranscript;
            if (currentText.trim() === "") return;

            // Only translate if there's meaningful change to save API calls
            updateUI("Traduzione...", currentText);
            const translated = await translateText(currentText);
            updateUI(translated, currentText);
        };

        recognition.onerror = (event) => {
            console.error("Speech error:", event.error);
            if (event.error === 'not-allowed') {
                updateUI("Errore Microfono", "Microphone access denied.");
            }
        };

        recognition.onend = () => {
            // Restart automatically if it stops
            setTimeout(() => recognition.start(), 1000);
        };

        // Start listening!
        updateUI("In ascolto...", "Listening in English...");
        recognition.start();
    }
</script>
</body>
</html>
